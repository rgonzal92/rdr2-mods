; Settings for the rebuilt RemoveSpeedLimits.asi. Copy this file next to the plugin, in the game
; folder. Only the number after "=" is read, so the text after it is a note.

[WALKING]
WALKING_SPEED=150       #Fast-walk pace x100 while fast walk is switched on. Kept between 100 and 300; missing or invalid means 150.
TAP_TO_WALK_MS=250      #While running after a sprint, a tap of the sprint key shorter than this many milliseconds brings you back to a walk without stopping; a longer press sprints. 0 switches it off. Needs SPRINT_BOOST=1. Missing means 250.

[FEATURES]
HORSE_BOOST=1           #On horseback: lift a mission's speed cap while forward or sprint is held, and keep a full gallop while sprint is held at a gallop. No pace is forced below a gallop.
SPRINT_BOOST=1          #On foot: sprint key plus a direction is a flat-out sprint (10.6), then a run (2.0) until you tap the sprint key or stop moving.
COVER_WALK_TOGGLE=1     #On foot: the cover key pressed while moving switches fast walk on or off and does not take cover; stand still to take cover. Set 0 to leave the cover key alone (fast walk is then off).
REMOVE_ZONE_SLOWDOWN=1  #Remove the slowdown zones around camps, towns and interiors, for the player and for the horse being ridden.
