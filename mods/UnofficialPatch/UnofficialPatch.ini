; Settings for UnofficialPatch.asi. Copy this file next to the plugin, in the game folder. Only the
; number after "=" is read, so the text after it is a note. Read once when the game loads the plugin.

[FIXES]
KNIFE_GUARD=1      #"We Loved Once and True": 1 keeps Arthur unarmed on foot within 110 m of the Chelonian camp for as long as that mission runs (no weapon, lantern or binoculars there), so the Throttle and Choke prompts cannot hang on a drawn knife. 0 switches it off. Missing means 1.
NIGHT_CLOTHES=1    #Camp members awake in night clothes: 0 off. 1 only writes to UnofficialPatch.log who is awake in a night outfit and changes nothing. 2 also asks the game's own script to pick a day outfit again. Missing means 1.
COOLDOWN_REFERENCE_FPS=0    #Random-encounter cooldowns run out faster the higher the frame rate. 0 off (the game as it is). 30, 40 or 60 make the cooldown clock run as it would at that frame rate: 30 is what console players get, 40 matches the game clock, 60 is a 60 fps PC. Encounters you have seen or finished then take longer to come back. Only 0 or 20 to 1000 count; anything else is off. Missing means 0.
TRAIN_WATCH=1      #1 writes to UnofficialPatch.log when an ambient train is switched off outside every town, and changes nothing. Any other number: off. Missing means 1.
DREAMCATCHERS=1    #Dreamcatchers entry back in the Log after all 20 are found and the arrowhead is taken: 0 off. 1 only writes to UnofficialPatch.log what it reads and when it would remove the entry. 2 also removes it, after two minutes of unpaused play (the next load adds it again, and the plugin removes it again). Missing means 1.
FISH_MARKS=1       #Mailed legendary fish that still show "not caught" on the map (13 fish; the Northern Pike is not covered): 0 off. 1 only writes to UnofficialPatch.log. 2 also sets the mark to "caught". Missing means 1.
JERUSALEM=2        #"A New Jerusalem" can leave John on the empty backup inventory (no weapons, satchel or outfits) after the epilogue weapons came back: 0 off. 1 only writes to UnofficialPatch.log. 2 switches him back to his own inventory, the mission's own call, when it happened in this session. 3 also when the save was already stuck when loaded (anything gathered while stuck stays behind). Never when his own inventory holds no weapons. Missing means 2.
RANCH_CHORES=2     #Emmet Granger's second part locks stall cleaning and cow milking at Beecher's Hope for good after "The Best of Women": 0 off. 1 only writes to UnofficialPatch.log. 2 unlocks stall cleaning again, the value the game itself sets (switching this off later leaves it unlocked). Missing means 2.
LATE_GAME_WATCH=1  #1 writes to UnofficialPatch.log what later fixes for the cleaver of "Jim Milton Rides, Again?" and the "Advertising" kill camera would decide on, and changes nothing. Any other number: off. Missing means 1.
