; Settings for BatchCrafting.asi. Copy this file next to the plugin, in the game folder. Only the
; number after "=" is read, so the text after it is a note.

[BATCH]
MAX_PER_ANIMATION=50    #How many items one crafting or cooking animation makes at most, the game's own item included. Never more than your ingredients pay for or than you can carry. 1 or 0 switches the plugin off. Missing means 50.
HOLD_SPEED_UP_KEY=1     #1 holds the speed-up key of cooking and fire crafting for you, so the progress bar takes about 4 to 5 seconds. 0 leaves it to you: 10 seconds, or less while you hold the key. Missing means 1.
